[package]
name = "tables"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
suite-common = { path = "../suite-common" }
tables-core = { path = "../tables-core" }
cairo-rs = { version = "0.22", features = ["png", "pdf"] }
pangocairo = "0.22"
# RFC-0005 option B: the shell speaks the sidecar's protocol over a pipe and
# links no network stack. Optional, and only the `collab` feature turns it on.
suite-collab = { path = "../suite-collab", optional = true }

[features]
# Collaboration (RFC-0005): the Collaborate menu, the status button and the
# two-heads banner. Off by default; the default build does not contain it.
default = []
collab = ["tables-core/collab", "dep:suite-collab"]

[[bin]]
name = "tables"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
